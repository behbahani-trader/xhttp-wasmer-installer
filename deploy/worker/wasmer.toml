[package]
name        = "xhttp-relay"
version     = "1.0.0"
description = "XHTTP transparent relay worker – forwards VLESS+XHTTP+TLS traffic through Wasmer Edge"
license     = "GPL-3.0"
readme      = "README.md"

[dependencies]
"wasmer/winterjs" = "^1"

[fs]
"/src" = "src"

[[command]]
name   = "script"
module = "wasmer/winterjs:winterjs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/src/index.js"]
